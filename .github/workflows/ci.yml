name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The leak checks diff against the base branch, which needs history.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Checked rather than written. 77 files had drifted from the .prettierrc
      # the repository ships, because the format script existed and nothing ran
      # it; a change that reformats what it touches then arrives as a diff
      # nobody can review (#327).
      - name: Formatting
        run: npm run format:check

      # The community directory reviews the stylesheet too, and found seven
      # duplicate declarations this had no way of seeing (#336). The rule set is
      # defects only — duplicates, unknown properties, invalid values — and not
      # taste, so it stays something to fix rather than something to silence.
      - name: Lint the stylesheet
        run: npm run lint:css

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, not after: tests/unit/bundle.test.ts audits the built
      # main.js for Node built-ins, which are fatal on mobile and which the
      # build itself cannot catch — they are marked external, so an accidental
      # import is left as a bare require and the build passes.
      - name: Build
        run: node esbuild.config.mjs production

      - name: Verify the build produced the release assets
        run: test -f main.js && test -f manifest.json && test -f styles.css

      - name: Test
        run: npm test

      # A second run, instrumented: its thresholds fail the job when a change lowers
      # unit coverage (#252). Timing budgets are lifted there, so they are proved by
      # the plain run above.
      - name: Unit coverage
        run: npm run test:coverage

      # Straight after the measurement, so the README cannot drift from it. A
      # badge typed by hand is a thing that looks green and proves nothing (#256).
      - name: Coverage badge matches the measurement
        run: npm run badges -- --check

  leaks:
    # The pre-commit hook covers the same ground locally, but it is opt-in
    # (core.hooksPath) and --no-verify skips it. This job is the enforced copy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The identity check looks up which pull request carries each pushed commit.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Expressions go through env rather than straight into run: a ${{ }} is
      # substituted textually before the shell sees it, which is a script
      # injection vector the moment one of these values is not a commit SHA.
      - name: Resolve scan range
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "based=yes" >> "$GITHUB_OUTPUT"
          # Push to main: scan the commits this push introduced. A force-push or
          # a history rewrite leaves `before` naming a commit no clone has, and a
          # branch creation sends all zeros; the range then fails to resolve and
          # the job died with "git exited 128", which reads as a broken scanner
          # rather than as a missing base (#179).
          elif git cat-file -e "${BEFORE}^{commit}" 2> /dev/null; then
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "head=$AFTER" >> "$GITHUB_OUTPUT"
            echo "based=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::push base $BEFORE is unavailable (force-push, rewrite or new branch); scanning the whole tree"
            echo "head=$AFTER" >> "$GITHUB_OUTPUT"
            echo "based=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for secrets and personal data
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          BASED: ${{ steps.range.outputs.based }}
        # Three dots: diff against the merge base. Two dots compares the two
        # tips, so anything main deleted after the fork point would show up as
        # an addition here and fail the PR for someone else's change.
        #
        # With no base, the empty tree stands in and every file reads as an
        # addition. That scans strictly more than the range it replaces, so a
        # rewrite cannot be the way a secret arrives unnoticed.
        run: |
          if [ "$BASED" = "yes" ]; then
            python3 ops/check-secrets.py --range "$BASE_SHA...$HEAD_SHA"
          else
            python3 ops/check-secrets.py --range "$(git hash-object -t tree /dev/null)..$HEAD_SHA"
          fi

      # Keyed on who opened the pull request a commit belongs to, never on the commit's
      # own identity: the commit made under the wrong identity is exactly the one that
      # must not be able to exempt itself (#251). Outside contributors' pull requests
      # stay exempt, on pushes to main as well.
      - name: Verify maintainer identity
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          MAINTAINER: ${{ github.repository_owner }}
          OPENER: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          BASED: ${{ steps.range.outputs.based }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two dots on purpose: this wants the commits the range adds.
          #
          # With no base, which commits the push added is not recoverable, so the
          # whole history is scanned instead. That used to be unusable -- it
          # reported the two 2026-09-13 merge commits under the author's real name
          # and every dependabot commit -- until #307 named both as what they are:
          # an allowlist of accepted history, and a bot exemption that does not
          # depend on a pull request association GitHub drops on fast-forward.
          # It costs one API call per commit, on a push that happens rarely.
          if [ "$BASED" != "yes" ]; then
            python3 ops/check-identity.py --range "$HEAD_SHA" --maintainer "$MAINTAINER" --repo "$REPO"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 ops/check-identity.py --range "$BASE_SHA..$HEAD_SHA" --maintainer "$MAINTAINER" --opener "$OPENER"
          else
            python3 ops/check-identity.py --range "$BASE_SHA..$HEAD_SHA" --maintainer "$MAINTAINER" --repo "$REPO"
          fi
