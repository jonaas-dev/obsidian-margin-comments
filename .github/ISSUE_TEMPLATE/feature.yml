name: Feature request
description: Something the plugin should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What were you doing when you wanted this?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.

  - type: textarea
    id: today
    attributes:
      label: How you work around it today
      description: Optional, and genuinely useful — a workaround usually says what the feature really has to do.
