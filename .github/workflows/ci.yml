name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The leak checks diff against the base branch, which needs history.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, not after: tests/unit/bundle.test.ts audits the built
      # main.js for Node built-ins, which are fatal on mobile and which the
      # build itself cannot catch — they are marked external, so an accidental
      # import is left as a bare require and the build passes.
      - name: Build
        run: node esbuild.config.mjs production

      - name: Verify the build produced the release assets
        run: test -f main.js && test -f manifest.json && test -f styles.css

      - name: Test
        run: npm test

  leaks:
    # The pre-commit hook covers the same ground locally, but it is opt-in
    # (core.hooksPath) and --no-verify skips it. This job is the enforced copy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Expressions go through env rather than straight into run: a ${{ }} is
      # substituted textually before the shell sees it, which is a script
      # injection vector the moment one of these values is not a commit SHA.
      - name: Resolve scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Push to main: scan the commits this push introduced.
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for secrets and personal data
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        # Three dots: diff against the merge base. Two dots compares the two
        # tips, so anything main deleted after the fork point would show up as
        # an addition here and fail the PR for someone else's change.
        run: python3 ops/check-secrets.py --range "$BASE_SHA...$HEAD_SHA"

      # The squash-merge commit GitHub creates on main carries the author's
      # public profile name, which we do not control. PR commits are already
      # checked here and by the pre-commit hook, so only run the identity guard
      # on pull requests.
      - name: Verify maintainer identity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          # Identity checks only apply to the maintainer's commits. Outside
          # contributors may use whatever address and name GitHub has on file.
          # Two dots here on purpose: this wants the commits the branch adds.
          if ! maintainer_shas=$(git log --format='%H' --author='jonaas-dev' "$BASE_SHA..$HEAD_SHA"); then
            echo "::error::Could not read the commit range $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          if [ -z "$maintainer_shas" ]; then
            exit 0
          fi

          addresses=$(printf '%s\n' "$maintainer_shas" | while read -r sha; do
            git log -1 --format='%ae%n%ce' "$sha"
          done)
          # The second pattern is GitHub's own noreply address, the committer on
          # every commit GitHub signs, Dependabot's included. It is anchored at
          # both ends so a prefixed or suffixed lookalike is still rejected.
          bad=$(printf '%s\n' "$addresses" | sort -u | grep -v -e 'users\.noreply\.github\.com$' -e '^noreply@github\.com$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Maintainer commits carry a non-noreply address, which would be published with the history:"
            printf '%s\n' "$bad"
            exit 1
          fi

          names=$(printf '%s\n' "$maintainer_shas" | while read -r sha; do
            git log -1 --format='%an%n%cn' "$sha"
          done)
          bad_names=$(printf '%s\n' "$names" | sort -u | grep -E '^[A-Z][a-z]+[[:space:]]+[A-Z]' || true)
          if [ -n "$bad_names" ]; then
            echo "::error::Maintainer commits carry a real-looking name, which would be published with the history:"
            printf '%s\n' "$bad_names"
            exit 1
          fi
