name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The leak checks diff against the base branch, which needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, not after: tests/unit/bundle.test.ts audits the built
      # main.js for Node built-ins, which are fatal on mobile and which the
      # build itself cannot catch — they are marked external, so an accidental
      # import is left as a bare require and the build passes.
      - name: Build
        run: node esbuild.config.mjs production

      - name: Verify the build produced the release assets
        run: test -f main.js && test -f manifest.json && test -f styles.css

      - name: Test
        run: npm test

  leaks:
    # The pre-commit hook covers the same ground locally, but it is opt-in
    # (core.hooksPath) and --no-verify skips it. This job is the enforced copy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Expressions go through env rather than straight into run: a ${{ }} is
      # substituted textually before the shell sees it, which is a script
      # injection vector the moment one of these values is not a commit SHA.
      - name: Scan for secrets and personal data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Three dots: diff against the merge base. Two dots compares the two
        # tips, so anything main deleted after the fork point would show up as
        # an addition here and fail the PR for someone else's change.
        run: python3 ops/check-secrets.py --range "$BASE_SHA...$HEAD_SHA"

      - name: Verify committer identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Two dots here on purpose: this wants the commits the branch adds.
          # git log is materialised first — folding it into the pipeline would
          # let `|| true` swallow its failure, and an unreadable range would
          # then be indistinguishable from a clean one.
          if ! addresses=$(git log --format='%ae%n%ce' "$BASE_SHA..$HEAD_SHA"); then
            echo "::error::Could not read the commit range $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          bad=$(printf '%s\n' "$addresses" | sort -u | grep -v 'users\.noreply\.github\.com$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits carry a non-noreply address, which would be published with the history:"
            printf '%s\n' "$bad"
            exit 1
          fi

          # Reject real names in author/committer identity. The public history
          # only needs the GitHub username; a real name is unnecessary PII.
          if ! names=$(git log --format='%an%n%cn' "$BASE_SHA..$HEAD_SHA"); then
            echo "::error::Could not read the commit range $BASE_SHA..$HEAD_SHA"
            exit 1
          fi
          bad_names=$(printf '%s\n' "$names" | sort -u | grep -E '^[A-Z][a-z]+[[:space:]]+[A-Z]' || true)
          if [ -n "$bad_names" ]; then
            echo "::error::Commits carry a real-looking name, which would be published with the history:"
            printf '%s\n' "$bad_names"
            exit 1
          fi
