# Analysed on demand against a local SonarQube server: `npm run sonar`, see CONTRIBUTING.md.
sonar.projectKey=Obsidian-Margin-Comments
sonar.projectName=Margin Comments
sonar.sourceEncoding=UTF-8

sonar.sources=src,styles.css
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The same list as OBSIDIAN_BOUND_FILES in vitest.coverage.config.ts (#252): files that only
# run inside Obsidian, covered by the E2E suite, which produces no coverage report. Kept in
# step by tests/unit/sonar-exclusions.test.ts, because a list repeated in two files drifts.
sonar.coverage.exclusions=\
  src/main.ts,\
  src/navigation.ts,\
  src/settings.ts,\
  src/vault-events.ts,\
  src/editor/bottom-sheet.ts,\
  src/editor/floating-comment.ts,\
  src/editor/hover-gutter.ts,\
  src/editor/thread-routing.ts,\
  src/reading/reading-marks.ts,\
  src/reading/reading-mode.ts,\
  src/ui/comment-panel.ts,\
  src/ui/render-comment-body.ts,\
  src/ui/confirm-modal.ts,\
  src/ui/thread-card.ts,\
  src/ui/thread-popover.ts
